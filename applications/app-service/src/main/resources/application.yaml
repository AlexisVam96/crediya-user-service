server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: crediya-user-service
  devtools:
    add-properties: false
  r2dbc:
    username: ${SPRING_R2DBC_USERNAME:admin}
    password: ${SPRING_R2DBC_PASSWORD:admin}
    host: ${SPRING_R2DBC_HOST:localhost}
    port: ${SPRING_R2DBC_PORT:5432}
    schema: public
    database: ${SPRING_R2DBC_DB:db_crediya_user}
    sslmode: ${SPRING_R2DBC_SSLMODE:AUTO}
  sql:
    init:
      platform: postgresql

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

jwt:
  secret: mysupersecretkey-crediya-1234567890
  expiration: 3600000 # 1 hour in milliseconds

